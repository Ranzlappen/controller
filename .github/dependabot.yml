# Weekly dependency updates.
#
# Trimmed from Ranzlappen/repo-standards templates/.github/dependabot.yml to the
# two ecosystems padmap actually uses. The v2 spam-mitigation expectations are
# applied to both: an explicit PR limit, triage labels, conventional-commit
# prefixes, and minor+patch grouped so majors land one per PR for review.

version: 2
updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions used in workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Python — runtime deps in pyproject.toml, dev toolchain in requirements-dev.txt
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      pip-prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      pip-dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
